
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: breast-cancer-api-container
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: breast-cancer-frontend-container
    ports:
      - "8501:8501"
    environment:
      API_URL: "http://backend:8000/predict"
    depends_on:
      backend:
        condition: service_healthy